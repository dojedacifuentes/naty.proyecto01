<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<!--
  Plantilla del quiz gamificado del módulo 2 (npm run quiz-juego). Un solo archivo que funciona sin internet: las
  fuentes entran en el marcador FUENTES y las preguntas, con el estilo de cada curso y quiz, en DATA. Si hay un LMS con
  SCORM 1.2 (Moodle, actividad "Paquete SCORM"), registra el mejor puntaje y la finalización; si no, no guarda nada.
  Mecánica: 5 niveles, XP (100 al primer intento, 50 al segundo), combos, 3 de energía, un comodín 50:50 por misión,
  estrellas, logros e insignia de oro, plata o bronce.
-->
<style>
/*FUENTES*/
:root{
  --bg0:#040714; --bg1:#0a1030;
  --tinta:#e8edff; --suave:#a6b3dc; --tenue:#7482b2;
  --ok:#34d399; --ok-rgb:52,211,153; --mal:#fb7185; --mal-rgb:251,113,133;
  --oro:#fcd34d; --plata:#d4dcea; --bronce:#e3a065;
  --acento:#22d3ee; --acento-rgb:34,211,238; --acento2:#ff7a59; --acento2-rgb:255,122,89;
  --sans:"Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;color:var(--tinta);font:16px/1.55 var(--sans);overflow-x:hidden;background-color:var(--bg0);
  background-image:radial-gradient(1000px 620px at 88% -8%,rgba(var(--acento-rgb),.22),transparent 62%),
    radial-gradient(820px 560px at -8% 108%,rgba(var(--acento2-rgb),.16),transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0) 72%);background-attachment:fixed}
#fondo,#confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fondo{z-index:0}
#confeti{z-index:30}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
.app{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:20px;height:20px;flex:none;display:block}
h1,h2,h3,p{margin:0}
h1:focus,h2:focus,p:focus{outline:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--oro);outline-offset:3px}

/* Paneles de vidrio con borde de neón */
.panel{position:relative;border-radius:22px;padding:30px;
  background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 26px,
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/26px 100%,
    linear-gradient(180deg,rgba(24,34,84,.78),rgba(8,13,38,.88));
  box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(135deg,rgba(var(--acento-rgb),.95),rgba(var(--acento-rgb),.08) 38%,rgba(var(--acento2-rgb),.08) 62%,rgba(var(--acento2-rgb),.85));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kicker{display:inline-flex;align-items:center;gap:10px;font:600 12px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acento)}
.kicker::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--acento);box-shadow:0 0 12px var(--acento)}

/* Botones */
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;font:600 14px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta);background:rgba(255,255,255,.04);border:1.5px solid rgba(var(--acento-rgb),.7);border-radius:14px;padding:15px 22px;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease}
.btn .i{width:16px;height:16px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(var(--acento-rgb),.25)}
.btn.principal{color:#041018;border-color:transparent;background:var(--acento);
  background:linear-gradient(135deg,var(--acento),color-mix(in srgb,var(--acento) 55%,#fff));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 12px 34px rgba(var(--acento-rgb),.42)}
.btn.pulso{animation:pulso 2.2s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 0 0 rgba(var(--acento-rgb),.55),0 12px 34px rgba(var(--acento-rgb),.42)}
  50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 0 0 14px rgba(var(--acento-rgb),0),0 12px 34px rgba(var(--acento-rgb),.42)}}
.acciones{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.acciones.centro{justify-content:center}

/* Portada */
.portada{display:grid;grid-template-columns:1.08fr .92fr;gap:26px;align-items:center}
.titulo{display:inline-block;margin:14px 0 10px;font:700 clamp(32px,5vw,50px)/1.04 var(--sans);letter-spacing:-.01em;text-wrap:balance;color:#fff;
  background:linear-gradient(92deg,#fff 0%,#e3e9ff 45%,var(--acento) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(var(--acento-rgb),.28))}
.mision{font-size:18px;color:var(--suave);margin-bottom:18px}
.mision b{color:#fff;font-weight:600}
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.regla{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(148,170,255,.14)}
.regla .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--acento-rgb),.14);color:var(--acento)}
.regla .ico .i{width:18px;height:18px}
.regla b{display:block;font:600 12.5px/1.25 var(--mono);letter-spacing:.04em;color:#fff;margin-bottom:3px}
.regla span{font-size:13px;line-height:1.4;color:var(--suave)}
.cuando,.nota{font-size:14px;color:var(--suave)}
.cuando b{color:var(--tinta)}
.nota{margin-top:4px}
.heroe{margin:0;position:relative;padding:8px;border-radius:20px;background:radial-gradient(circle at 50% 45%,rgba(var(--acento-rgb),.18),transparent 66%)}
.heroe svg{display:block;width:100%;height:auto;overflow:visible}
.lema{margin-top:8px;text-align:center;font:600 12px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.h-txt{font:600 12.5px var(--mono);letter-spacing:.06em;fill:var(--tinta)}
.h-sub{font:600 11px var(--mono);letter-spacing:.1em;fill:var(--suave)}
.h-cable{fill:none;stroke:var(--acento);stroke-width:2.2;stroke-dasharray:7 9;animation:fluir 1.1s linear infinite;opacity:.9}
.h-cable.b{stroke:var(--acento2)}
@keyframes fluir{to{stroke-dashoffset:-32}}
.h-parpadeo{animation:parpadeo 1.1s steps(2) infinite}
@keyframes parpadeo{50%{opacity:0}}
.h-flota{animation:flota 3.2s ease-in-out infinite}
@keyframes flota{50%{transform:translateY(-6px)}}

/* Barra superior: ruta de niveles, XP, estrellas, energía y sonido */
.hud{position:sticky;top:10px;z-index:5;display:grid;grid-template-columns:auto 1fr auto;gap:12px 18px;align-items:center;padding:11px 16px;border-radius:16px;
  background:rgba(7,11,32,.78);border:1px solid rgba(var(--acento-rgb),.3);box-shadow:0 12px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hud-id{display:flex;align-items:center;gap:9px;font:600 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--suave);white-space:nowrap;min-width:0;overflow:hidden}
.hud-id b{color:var(--tinta);overflow:hidden;text-overflow:ellipsis;margin-left:-6px}
.led{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none;animation:parpadeo 1.6s steps(2) infinite}
.ruta{display:flex;align-items:center;justify-content:center;min-width:0}
.nodo{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);color:var(--tenue);
  background:rgba(255,255,255,.04);border:1.5px solid rgba(148,170,255,.28);transition:all .3s ease}
.nodo .i{width:15px;height:15px}
.nodo.jefe{border-style:dashed;border-color:rgba(var(--acento2-rgb),.7);color:var(--acento2)}
.nodo.actual{color:var(--acento);border:1.5px solid var(--acento);background:rgba(var(--acento-rgb),.14);box-shadow:0 0 0 4px rgba(var(--acento-rgb),.14),0 0 18px rgba(var(--acento-rgb),.6);animation:latido 1.5s ease-in-out infinite}
.nodo.oro{background:var(--oro);border-color:var(--oro);color:#2b1d00;box-shadow:0 0 14px rgba(252,211,77,.6)}
.nodo.ok{background:var(--ok);border-color:var(--ok);color:#03281c}
.nodo.mal{background:var(--mal);border-color:var(--mal);color:#3a0710}
@keyframes latido{50%{box-shadow:0 0 0 7px rgba(var(--acento-rgb),.05),0 0 26px rgba(var(--acento-rgb),.8)}}
.enlace{flex:1;min-width:10px;max-width:64px;height:3px;border-radius:2px;background:rgba(148,170,255,.18);position:relative;overflow:hidden}
.enlace.lleno{background:linear-gradient(90deg,rgba(var(--acento-rgb),.95),rgba(var(--acento2-rgb),.95))}
.enlace.lleno::after{content:"";position:absolute;top:-2px;left:-30%;width:26%;height:7px;border-radius:4px;background:#fff;filter:blur(2px);animation:paquete 1.5s linear infinite}
@keyframes paquete{to{left:115%}}
.stats{display:flex;align-items:center;gap:14px}
.xp{display:inline-flex;align-items:baseline;gap:4px;font:600 21px/1 var(--mono);color:#fff;text-shadow:0 0 14px rgba(var(--acento-rgb),.65);font-variant-numeric:tabular-nums}
.xp small{font-size:11px;color:var(--acento);letter-spacing:.12em}
.est{display:inline-flex;gap:5px;align-items:center;font:600 16px/1 var(--mono);color:var(--oro)}
.est .i{width:18px;height:18px;filter:drop-shadow(0 0 6px rgba(252,211,77,.6))}
.energia{display:inline-flex;gap:3px;align-items:center}
.celda{width:9px;height:18px;border-radius:3px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);transition:all .3s}
.celda.on{background:linear-gradient(180deg,#a7f3d0,var(--ok));border-color:transparent;box-shadow:0 0 8px rgba(var(--ok-rgb),.6)}
.icono-btn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(148,170,255,.28);background:rgba(255,255,255,.04);color:var(--suave);display:grid;place-items:center;cursor:pointer}
.icono-btn[aria-pressed="true"]{color:var(--acento);border-color:rgba(var(--acento-rgb),.7)}

/* Nivel */
.nivel-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.nivel-id{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{font:600 11px/1 var(--mono);letter-spacing:.1em;padding:6px 10px;border-radius:999px;background:rgba(var(--acento-rgb),.14);color:var(--acento);border:1px solid rgba(var(--acento-rgb),.4)}
.combo{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 10px;border-radius:999px;color:#241100;
  background:linear-gradient(90deg,var(--oro),var(--acento2));box-shadow:0 0 16px rgba(var(--acento2-rgb),.5)}
.combo .i{width:13px;height:13px}
.comodin{display:inline-flex;align-items:center;gap:8px;font:600 12px/1 var(--mono);letter-spacing:.1em;padding:9px 13px;border-radius:12px;color:var(--tinta);
  background:rgba(var(--acento2-rgb),.12);border:1px solid rgba(var(--acento2-rgb),.6);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.comodin:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 18px rgba(var(--acento2-rgb),.4)}
.comodin .i{width:16px;height:16px;color:var(--acento2)}
.comodin:disabled{opacity:.38;cursor:not-allowed}
.enunciado{font:600 clamp(20px,2.6vw,26px)/1.35 var(--sans);color:#fff;text-wrap:pretty}
.pista{margin:10px 0 20px;font:500 13px/1.45 var(--mono);color:var(--suave)}
.opciones{display:grid;gap:12px}
.opciones.dos{grid-template-columns:1fr 1fr}
.opcion{position:relative;display:grid;grid-template-columns:42px 1fr 24px;gap:14px;align-items:center;width:100%;text-align:left;overflow:hidden;
  font:500 16px/1.4 var(--sans);color:var(--tinta);padding:15px 16px 15px 14px;border-radius:16px;cursor:pointer;
  background:linear-gradient(180deg,rgba(48,64,138,.5),rgba(20,30,72,.64));border:1px solid rgba(148,170,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .2s ease}
.opcion::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.13) 50%,transparent 70%);
  transform:translateX(-120%);transition:transform .6s ease}
.opcion:hover:not(:disabled)::before{transform:translateX(120%)}
.opcion:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(var(--acento-rgb),.85);box-shadow:0 0 0 1px rgba(var(--acento-rgb),.3),0 14px 32px rgba(var(--acento-rgb),.2)}
.opcion:disabled{cursor:default}
.tecla{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:600 16px var(--mono);color:var(--acento);
  background:linear-gradient(180deg,#2d3d82,#18234f);box-shadow:0 3px 0 #090f2c,inset 0 1px 0 rgba(255,255,255,.2)}
.marca{display:grid;place-items:center}
.marca .i{width:22px;height:22px}
.opcion.correcta{border-color:var(--ok);background:linear-gradient(180deg,rgba(var(--ok-rgb),.28),rgba(8,58,42,.6));box-shadow:0 0 0 1px rgba(var(--ok-rgb),.45),0 0 30px rgba(var(--ok-rgb),.32)}
.opcion.correcta .tecla{background:var(--ok);color:#03281c;box-shadow:0 3px 0 #0a4a33}
.opcion.correcta .marca,.opcion.revelada .marca{color:var(--ok)}
.opcion.revelada{border:1.5px dashed var(--ok)}
.opcion.incorrecta{border-color:var(--mal);background:linear-gradient(180deg,rgba(var(--mal-rgb),.24),rgba(70,14,32,.6))}
.opcion.incorrecta .tecla{background:var(--mal);color:#3a0710;box-shadow:0 3px 0 #6b1426}
.opcion.incorrecta .marca{color:var(--mal)}
.opcion.apagada,.opcion.descartada{opacity:.4}
.opcion.descartada .texto{text-decoration:line-through}
.glitch{animation:glitch .4s steps(2) both}
@keyframes glitch{20%{transform:translate(-6px,1px);filter:hue-rotate(-25deg)}40%{transform:translate(6px,-1px)}60%{transform:translate(-3px,0);filter:none}80%{transform:translate(3px,1px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}}
.panel.jefe::before{background:linear-gradient(135deg,rgba(var(--acento2-rgb),1),rgba(var(--acento2-rgb),.1) 40%,rgba(var(--acento-rgb),.1) 60%,rgba(var(--acento-rgb),.9))}
.alerta{height:6px;border-radius:3px;margin:-10px 0 18px;opacity:.85;background:repeating-linear-gradient(135deg,rgba(var(--acento2-rgb),.95) 0 10px,transparent 10px 20px);animation:franjas 1s linear infinite;background-size:28px 100%}
@keyframes franjas{to{background-position:28px 0}}
.retro{margin-top:18px;padding:18px 20px;border-radius:16px;border:1px solid rgba(var(--ok-rgb),.5);
  background:linear-gradient(180deg,rgba(var(--ok-rgb),.13),rgba(var(--ok-rgb),.04));animation:entrar .35s ease both}
.retro.mal{border-color:rgba(var(--mal-rgb),.55);background:linear-gradient(180deg,rgba(var(--mal-rgb),.13),rgba(var(--mal-rgb),.04))}
@keyframes entrar{from{opacity:0;transform:translateY(8px)}}
.retro-cab{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.sello{display:inline-flex;align-items:center;gap:7px;font:600 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ok)}
.sello .i{width:16px;height:16px}
.retro.mal .sello{color:var(--mal)}
.ganancia{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);padding:6px 9px;border-radius:8px;background:rgba(252,211,77,.14);color:var(--oro);border:1px solid rgba(252,211,77,.45)}
.ganancia .i{width:13px;height:13px}
.retro-titulo{font:600 17px/1.4 var(--sans);color:#fff}
.retro-lbl{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--acento);margin:14px 0 6px}
.retro-texto{color:#dbe4ff}
.retro .acciones{margin-top:16px}

/* Destellos y textos flotantes */
.flash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;pointer-events:none;opacity:0}
.flash.ver{animation:flash 1s ease forwards}
.flash .grande{display:block;text-align:center;font:600 clamp(40px,9vw,92px)/1 var(--mono);letter-spacing:.08em;color:#fff;
  text-shadow:4px 0 0 rgba(var(--acento2-rgb),.8),-4px 0 0 rgba(var(--acento-rgb),.8),0 0 44px rgba(var(--acento-rgb),.6)}
.flash .sub{display:block;text-align:center;margin-top:14px;font:600 14px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--acento)}
@keyframes flash{0%{opacity:0;transform:scale(1.18)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.96)}}
.flotante{position:fixed;z-index:21;pointer-events:none;font:600 22px var(--mono);color:var(--oro);text-shadow:0 0 16px rgba(252,211,77,.8);animation:flotar 1.2s ease-out forwards}
@keyframes flotar{from{opacity:1;transform:translate(-50%,0) scale(.9)}to{opacity:0;transform:translate(-50%,-64px) scale(1.18)}}

/* Final */
.final{text-align:center}
.titulo-final{margin:10px 0 2px;font:600 clamp(30px,6vw,54px)/1.05 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;
  text-shadow:3px 0 rgba(var(--acento2-rgb),.75),-3px 0 rgba(var(--acento-rgb),.75),0 0 30px rgba(var(--acento-rgb),.5)}
.medalla-caja{position:relative;width:230px;height:230px;margin:0 auto;display:grid;place-items:center}
.rayos{position:absolute;inset:-6px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(var(--m-rgb),.34) 0deg 5deg,transparent 5deg 20deg);
  -webkit-mask:radial-gradient(circle,#000 28%,transparent 70%);mask:radial-gradient(circle,#000 28%,transparent 70%);animation:girar 16s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.medalla{position:relative;width:158px;height:auto;filter:drop-shadow(0 0 26px rgba(var(--m-rgb),.6));animation:aparecer .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes aparecer{from{transform:scale(.3) rotate(-18deg);opacity:0}}
.insignia{font:600 20px/1.3 var(--sans);color:#fff}
.insignia b{color:rgb(var(--m-rgb))}
.nivel-medalla{margin-top:4px;font:600 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.fila-estrellas{display:flex;justify-content:center;gap:8px;margin:14px 0 6px}
.fila-estrellas .i{width:30px;height:30px;color:rgba(255,255,255,.14)}
.fila-estrellas .gana{color:var(--oro);filter:drop-shadow(0 0 8px rgba(252,211,77,.7));animation:aparecer .5s cubic-bezier(.2,1.5,.4,1) both}
.xp-total{font:600 clamp(42px,7vw,66px)/1 var(--mono);color:#fff;text-shadow:0 0 26px rgba(var(--acento-rgb),.65);font-variant-numeric:tabular-nums;margin-top:8px}
.xp-total small{font-size:.32em;color:var(--acento);letter-spacing:.14em;margin-left:6px}
.desglose{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 20px}
.desglose span{font:600 12px/1 var(--mono);padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(148,170,255,.2);color:var(--suave)}
.desglose b{color:#fff}
.subt{font:600 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--acento);margin:4px 0 12px}
.logros{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:20px;text-align:left}
.logro{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(148,170,255,.14);color:var(--tenue)}
.logro .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.05)}
.logro .ico .i{width:18px;height:18px}
.logro b{display:block;font:600 13px/1.2 var(--sans);color:var(--suave)}
.logro small{display:block;font-size:12px;line-height:1.3;margin-top:2px}
.logro.si{border-color:rgba(252,211,77,.6);background:linear-gradient(180deg,rgba(252,211,77,.13),rgba(252,211,77,.03));color:var(--suave);box-shadow:0 0 18px rgba(252,211,77,.14)}
.logro.si .ico{background:rgba(252,211,77,.2);color:var(--oro)}
.logro.si b{color:#fff}
.resumen-ruta{display:flex;justify-content:center;align-items:center;margin:4px 0 16px}
.siguiente{font-size:16px;color:var(--suave)}
.siguiente b{color:#fff}
.registro{margin-top:6px;font-size:13px;color:var(--tenue)}
.revision{text-align:left;margin-top:22px;display:grid;gap:12px}
.revision article{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(148,170,255,.16)}
.revision h3{font:600 15px/1.4 var(--sans);color:#fff;margin-bottom:6px}
.revision .r-ok{font:600 14px/1.4 var(--sans);color:var(--ok);margin-bottom:6px}
.revision p{font-size:14px;color:var(--suave)}
.pie{position:relative;z-index:2;text-align:center;font:500 12px/1.4 var(--mono);color:var(--tenue);padding:0 16px 18px}

@media (max-width:820px){
  .portada{grid-template-columns:1fr}
  .heroe{order:-1;max-width:520px;margin:0 auto;width:100%}
}
@media (max-width:680px){
  .app{padding:10px 10px 18px}
  .panel{padding:20px 16px;border-radius:18px}
  .hud{grid-template-columns:1fr auto;top:6px;padding:10px 12px}
  .hud-tema{display:none}
  .stats{gap:10px}
  .ruta{grid-column:1/-1;order:3}
  .opciones.dos{grid-template-columns:1fr}
  .opcion{grid-template-columns:36px 1fr 20px;gap:10px;padding:12px}
  .tecla{width:34px;height:34px}
  .nodo{width:28px;height:28px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<main id="app" class="app"></main>
<p class="pie" id="pie"></p>
<div id="aviso" class="sr" role="status" aria-live="polite"></div>
<div id="flash" class="flash" aria-hidden="true"></div>
<canvas id="confeti" aria-hidden="true"></canvas>
<script>
const DATOS = /*DATA*/;
(() => {
  'use strict';
  const D = DATOS;
  const T = D.estilo;
  const N = D.preguntas.length;
  const LETRAS = 'ABCD';
  const BASE = [100, 50];                 // XP por acierto al primer y al segundo intento
  const COMBO = 25;                       // bono por racha: +25, +50, +75... desde el segundo acierto seguido
  const ENERGIA = 3;
  const POR_ENERGIA = 50;                 // XP por cada unidad de energía que queda al final
  const CON_COMODIN = 50;                 // XP de un nivel resuelto con el comodín 50:50
  const MAXIMO = N * BASE[0] + (COMBO * N * (N - 1)) / 2 + ENERGIA * POR_ENERGIA;
  const app = document.getElementById('app');
  const aviso = document.getElementById('aviso');
  const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; };
  const raiz = document.documentElement.style;
  raiz.setProperty('--acento', T.acento); raiz.setProperty('--acento-rgb', rgb(T.acento));
  raiz.setProperty('--acento2', T.acento2); raiz.setProperty('--acento2-rgb', rgb(T.acento2));

  // ------------------------------------------------------------------ íconos (24 x 24, trazo)
  const P = {
    estrella: '<path d="M12 2.8l2.8 5.9 6.5.8-4.8 4.5 1.2 6.4L12 17.2l-5.7 3.2 1.2-6.4-4.8-4.5 6.5-.8z" fill="currentColor" stroke="none"/>',
    ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    mal: '<path d="M6 6l12 12M18 6L6 18"/>',
    play: '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>',
    repetir: '<path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/>',
    bandera: '<path d="M5 21V4h11l-2 4 2 4H5"/>',
    niveles: '<path d="M4 20v-5M10 20V10M16 20v-7M22 20V4"/>',
    combo: '<path d="M12 2.5c1 4 6 5.2 6 10.8a6 6 0 0 1-12 0c0-3 2-5 3-6 0 2 1 3 2 3 0-3-1-5 1-7.8z"/>',
    bateria: '<rect x="2.5" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3M6 10.5v3M9.5 10.5v3M13 10.5v3"/>',
    comodin: '<rect x="3.5" y="3" width="11" height="15" rx="2"/><path d="M9.5 21H18a2 2 0 0 0 2-2V8"/><path d="M7 8l4 5M11 8l-4 5"/>',
    sonido: '<path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>',
    silencio: '<path d="M4 9.5v5h4l5 4v-13l-5 4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/>',
    candado: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    trofeo: '<path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4"/>',
    diana: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/>',
    escudo: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    escalar: '<path d="M3 20l6-10 4 6 3-4 5 8z"/><path d="M14 4h4v3h-4z"/>',
    doc: '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
    engranaje: '<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
    bd: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
    entrada: '<path d="M3 12h10M9 8l4 4-4 4"/><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/>',
    transformar: '<path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>',
    salida: '<path d="M10 12h11M17 8l4 4-4 4"/><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"/>',
    paquete: '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
    rombo: '<path d="M12 3l9 9-9 9-9-9z"/>',
    ruta: '<path d="M5 19c6 0 4-14 14-14"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/>',
    bicho: '<rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V4M9 4l1.5 2M15 4l-1.5 2M4 11h4M16 11h4M4 16h4M16 16h4"/>',
    enviar: '<path d="M3 11.5l18-7.5-7.5 18-2.5-8z"/>',
    chip: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/><rect x="10" y="10" width="4" height="4" rx=".5"/>',
    llaves: '<path d="M8 4c-2 0-3 1-3 3v2.5c0 1-1 2-2 2.5 1 .5 2 1.5 2 2.5V17c0 2 1 3 3 3M16 4c2 0 3 1 3 3v2.5c0 1 1 2 2 2.5-1 .5-2 1.5-2 2.5V17c0 2-1 3-3 3"/>',
    chat: '<path d="M4 5h16v11H9.5L4 20z"/>',
    chispa: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
    numeral: '<path d="M9.5 3L7.5 21M16.5 3l-2 18M4 8.5h17M3 15.5h17"/>',
    barras: '<path d="M4 20h16M7 16v-5M12 16V6M17 16V9"/>',
  };
  const ico = (n, clase = '') => `<svg class="i ${clase}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;
  const icoEn = (n, x, y, s, color = 'var(--acento)') => `<g transform="translate(${x} ${y}) scale(${s})" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${color}">${P[n] || ''}</g>`;

  // ------------------------------------------------------------------ sonido (sintetizado, apagado de partida)
  const sonido = {
    on: false, ctx: null,
    activar(v) {
      this.on = v;
      if (v && !this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; } }
    },
    tono(f, t = 0, d = 0.12, tipo = 'sine', v = 0.06) {
      if (!this.on || !this.ctx) return;
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + t;
      o.type = tipo; o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + d + 0.03);
    },
    ok() { this.tono(660, 0, 0.1, 'triangle'); this.tono(990, 0.09, 0.18, 'triangle'); },
    mal() { this.tono(210, 0, 0.22, 'sawtooth', 0.035); this.tono(150, 0.09, 0.24, 'sawtooth', 0.03); },
    nivel() { [523, 659, 784].forEach((f, i) => this.tono(f, i * 0.07, 0.12, 'square', 0.022)); },
    final() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tono(f, i * 0.11, 0.22, 'triangle', 0.05)); },
    clic() { this.tono(1200, 0, 0.05, 'square', 0.015); },
  };

  // ------------------------------------------------------------------ SCORM 1.2
  // Solo actúa si el LMS ofrece la API (Moodle, actividad "Paquete SCORM"). Guarda el mejor puntaje (0-100).
  const scorm = (() => {
    let api = null; let activo = false; let previo = 0;
    const buscar = (w) => {
      for (let n = 0; w && n < 12; n++) {
        try { if (w.API) return w.API; } catch (e) { return null; }
        if (!w.parent || w.parent === w) break;
        w = w.parent;
      }
      return null;
    };
    try { api = buscar(window) || (window.opener ? buscar(window.opener) : null); } catch (e) { api = null; }
    const llamar = (f, ...a) => { try { return String(api[f](...a)); } catch (e) { return ''; } };
    return {
      get activo() { return activo; },
      iniciar() {
        if (!api) return;
        activo = llamar('LMSInitialize', '') === 'true';
        if (!activo) return;
        previo = Number(llamar('LMSGetValue', 'cmi.core.score.raw')) || 0;
        const e = llamar('LMSGetValue', 'cmi.core.lesson_status');
        if (!e || e === 'not attempted') llamar('LMSSetValue', 'cmi.core.lesson_status', 'incomplete');
        llamar('LMSCommit', '');
      },
      registrar(porcentaje) {
        if (!activo) return;
        previo = Math.max(previo, porcentaje);
        llamar('LMSSetValue', 'cmi.core.score.min', '0');
        llamar('LMSSetValue', 'cmi.core.score.max', '100');
        llamar('LMSSetValue', 'cmi.core.score.raw', String(previo));
        llamar('LMSSetValue', 'cmi.core.lesson_status', 'completed');
        llamar('LMSCommit', '');
      },
      cerrar() { if (!activo) return; activo = false; llamar('LMSFinish', ''); },
    };
  })();

  // ------------------------------------------------------------------ estado
  let est;
  const reiniciar = () => {
    est = { nivel: 0, xp: 0, intentos: 0, cerrado: true, resultados: [], combo: 0, comboMax: 0, energia: ENERGIA, comodin: false, comodinAhora: false };
  };
  const estrellas = () => est.resultados.filter((r) => r && r.intento === 1 && !r.comodin).length;
  const intentosDe = (p) => (est.comodinAhora || p.opciones.length <= 2 ? 1 : 2);
  const anunciar = (t) => { aviso.textContent = ''; setTimeout(() => { aviso.textContent = t; }, 60); };
  const enfocar = () => { const f = document.getElementById('foco'); if (f) f.focus({ preventScroll: true }); window.scrollTo({ top: 0, behavior: reducido ? 'auto' : 'smooth' }); };

  function contar(el, desde, hasta, ms = 700) {
    if (!el) return;
    el.dataset.valor = hasta;
    if (reducido || desde === hasta) { el.textContent = hasta; return; }
    const t0 = performance.now();
    // Respaldo: si el navegador pausa las animaciones (pestaña en segundo plano, marco oculto del LMS), igual queda el valor final.
    setTimeout(() => { if (el.dataset.valor === String(hasta)) el.textContent = hasta; }, ms + 120);
    const paso = (t) => {
      const k = Math.max(0, Math.min(1, (t - t0) / ms));   // el primer cuadro puede traer una hora anterior a t0
      el.textContent = Math.round(desde + (hasta - desde) * (1 - Math.pow(1 - k, 3)));
      if (k < 1) requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  function rutaHtml(actual) {
    return D.preguntas.map((_, k) => {
      const r = est.resultados[k];
      const c = r ? (r.intento === 1 && !r.comodin ? 'oro' : r.intento ? 'ok' : 'mal') : (k === actual ? 'actual' : '');
      const enlace = k < N - 1 ? `<span class="enlace ${r ? 'lleno' : ''}"></span>` : '';
      return `<span class="nodo ${c} ${k === N - 1 ? 'jefe' : ''}" title="Nivel ${k + 1}">${k === N - 1 ? ico('bandera') : k + 1}</span>${enlace}`;
    }).join('');
  }

  function hud(xpMostrar = est.xp) {
    const celdas = Array.from({ length: ENERGIA }, (_, k) => `<span class="celda ${k < est.energia ? 'on' : ''}"></span>`).join('');
    const hechos = est.resultados.filter(Boolean).length;
    return `<header class="hud" id="hud">
      <div class="hud-id"><span class="led"></span><span>${esc(D.curso)} · Q${D.quiz}</span><b class="hud-tema"> · ${esc(D.tema)}</b></div>
      <div class="ruta" role="progressbar" aria-label="Niveles completados" aria-valuemin="0" aria-valuemax="${N}" aria-valuenow="${hechos}">${rutaHtml(est.nivel)}</div>
      <div class="stats">
        <span class="xp"><span id="xp" data-valor="${est.xp}">${xpMostrar}</span><small>XP</small></span>
        <span class="est" title="Estrellas">${ico('estrella')}<span id="est">${estrellas()}</span><span class="sr">&nbsp;estrellas</span></span>
        <span class="energia" id="energia" title="Energía" role="img" aria-label="Energía: ${est.energia} de ${ENERGIA}">${celdas}</span>
        <button class="icono-btn" id="btn-sonido" aria-pressed="${sonido.on}" title="Sonido">${ico(sonido.on ? 'sonido' : 'silencio')}<span class="sr">Sonido</span></button>
      </div>
    </header>`;
  }
  function refrescarHud(xpAntes) {
    const h = document.getElementById('hud');
    if (!h) return;
    h.outerHTML = hud(xpAntes);
    contar(document.getElementById('xp'), xpAntes, est.xp);
  }

  // ------------------------------------------------------------------ ilustración de la portada (una por quiz)
  // Lienzo de 460 x 340 con margen alrededor. Las etiquetas vienen de ESTILOS (scripts/quiz-juego.mjs).
  const H = T.heroe;
  const VB = 'viewBox="-20 -12 500 364"';
  const defsHeroe = `<defs>
    <linearGradient id="h-borde" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acento)"/><stop offset="1" style="stop-color:var(--acento2)"/></linearGradient>
    <linearGradient id="h-caja" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a6c"/><stop offset="1" stop-color="#0a1134"/></linearGradient>
    <pattern id="h-puntos" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="rgba(160,180,255,.2)"/></pattern>
    <filter id="h-brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs><rect x="-20" y="-12" width="500" height="364" rx="22" fill="url(#h-puntos)" opacity=".75"/>`;
  const aria = () => `role="img" aria-label="${esc(H.nodos.map((n) => n[0]).join(', '))}"`;
  const caja = (x, y, w, h, etiqueta, icono, retraso = 0) => `<g class="h-flota" style="animation-delay:${retraso}s">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="url(#h-caja)" stroke="url(#h-borde)" stroke-width="2"/>
      <rect x="${x + 2}" y="${y + 2}" width="${w - 4}" height="${h / 2.3}" rx="16" fill="rgba(255,255,255,.045)"/>
      <circle cx="${x + w / 2}" cy="${y + 46}" r="26" fill="rgba(var(--acento-rgb),.15)"/>
      ${icoEn(icono, x + w / 2 - 16, y + 30, 1.33)}
      <text x="${x + w / 2}" y="${y + h - 20}" text-anchor="middle" class="h-txt">${esc(etiqueta.toUpperCase())}</text></g>`;
  const cable = (d, clase = '', dur = 2.2) => `<path class="h-cable ${clase}" d="${d}"/>${reducido ? '' : `<circle r="5" fill="#fff" filter="url(#h-brillo)"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle><circle r="3" fill="#fff"><animateMotion dur="${dur}s" repeatCount="indefinite" path="${d}"/></circle>`}`;
  const anim = (atributo, valores, dur, desde = 0) => (reducido ? '' : `<animate attributeName="${atributo}" values="${valores}" dur="${dur}s" begin="${desde}s" repeatCount="indefinite"/>`);
  const lineas = (x, y, anchos, color) => anchos.map((w, k) => `<rect x="${x}" y="${y + k * 18}" width="${w}" height="9" rx="4.5" fill="${color}"/>`).join('');

  function heroeFlujo() {
    const [a, b, c] = H.nodos;
    const terminal = H.variante === 'terminal';
    const barras = H.variante === 'barras';
    const y = barras ? 40 : terminal ? 92 : 100;
    let fondo = '';
    let extra = '';
    if (terminal) {
      fondo = `<rect x="-12" y="14" width="484" height="322" rx="20" fill="rgba(6,10,30,.78)" stroke="rgba(148,170,255,.28)"/>
        <path d="M-12 34a20 20 0 0 1 20-20h444a20 20 0 0 1 20 20v18h-484z" fill="rgba(255,255,255,.06)"/>
        <circle cx="10" cy="33" r="6" fill="#fb7185"/><circle cx="30" cy="33" r="6" fill="#fcd34d"/><circle cx="50" cy="33" r="6" fill="#34d399"/>
        <text x="236" y="38" text-anchor="middle" class="h-sub">NUBE-SUR ~ LABORATORIO</text>
        ${lineas(8, 256, [196, 290, 146], 'rgba(var(--acento-rgb),.42)')}
        <rect x="162" y="290" width="10" height="15" fill="var(--acento)" class="h-parpadeo"/>`;
    }
    if (barras) {
      extra = `<path d="M334 300 H460" stroke="rgba(148,170,255,.4)" stroke-width="1.5"/>` + (H.barras || []).map((t, k) => {
        const x = 350 + k * 60; const alto = [104, 76][k] || 60;
        return `<rect x="${x}" y="${300 - alto}" width="40" height="${alto}" rx="7" fill="${k ? 'var(--acento2)' : 'var(--acento)'}" opacity=".92">${anim('height', `${alto * 0.35};${alto};${alto * 0.7};${alto}`, 3 + k)}${anim('y', `${300 - alto * 0.35};${300 - alto};${300 - alto * 0.7};${300 - alto}`, 3 + k)}</rect>
          <text x="${x + 20}" y="324" text-anchor="middle" class="h-sub">${esc(t)}</text>`;
      }).join('') + `<path d="M396 174 V 192" class="h-cable b"/>`;
    }
    return `<svg ${VB} ${aria()}>${defsHeroe}${fondo}
      ${cable(`M128 ${y + 64} L 166 ${y + 64}`)}
      ${cable(`M294 ${y + 64} L 332 ${y + 64}`, 'b', 2.6)}
      ${caja(0, y, 128, 132, a[0], a[1], 0)}${caja(166, y, 128, 132, b[0], b[1], 0.4)}${caja(332, y, 128, 132, c[0], c[1], 0.8)}
      ${extra}
    </svg>`;
  }

  function heroeDecision() {
    const [a, cond, r1, r2] = H.nodos;
    return `<svg ${VB} ${aria()}>${defsHeroe}
      ${cable('M112 172 L 150 172')}
      ${cable('M246 146 C 292 108, 290 74, 330 72', '', 2.4)}
      ${cable('M246 198 C 292 236, 290 268, 330 270', 'b', 2.8)}
      ${caja(0, 108, 112, 128, a[0], a[1], 0)}
      <g class="h-flota" style="animation-delay:.3s"><path d="M205 96 L281 172 L205 248 L129 172 Z" fill="url(#h-caja)" stroke="url(#h-borde)" stroke-width="2"/>

  // ------------------------------------------------------------------ confeti y chispas
  const lienzo = document.getElementById('confeti');
  const cctx = lienzo.getContext('2d');
  let piezas = [];
  let girando = false;
  function rafaga(x, y, cantidad, fuerza) {
    if (reducido) return;
    const dpr = window.devicePixelRatio || 1;
    if (lienzo.width !== Math.round(innerWidth * dpr)) { lienzo.width = innerWidth * dpr; lienzo.height = innerHeight * dpr; cctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    const colores = [T.acento, T.acento2, '#fcd34d', '#ffffff', '#34d399'];
    for (let k = 0; k < cantidad; k++) {
      const a = Math.random() * Math.PI * 2; const v = (Math.random() * 9 + 3) * fuerza;
      piezas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 5 * fuerza, r: Math.random() * 5 + 3, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.35, vida: 0, color: colores[k % colores.length] });
    }
    if (!girando) { girando = true; requestAnimationFrame(cuadro); }
  }
  function cuadro() {
    cctx.clearRect(0, 0, innerWidth, innerHeight);
    piezas = piezas.filter((p) => p.vida < 150 && p.y < innerHeight + 40);
    for (const p of piezas) {
      p.vy += 0.28; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vida++;
      cctx.save(); cctx.globalAlpha = Math.max(0, 1 - p.vida / 150); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.color; cctx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * 0.66); cctx.restore();
    }
    if (piezas.length) requestAnimationFrame(cuadro); else { girando = false; cctx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  // ------------------------------------------------------------------ fondo animado: circuito (PF1821) o red neuronal (PF1822)
  function fondo() {
    const cv = document.getElementById('fondo');
    const ctx = cv.getContext('2d');
    const A = `rgba(${rgb(T.acento)},`; const B = `rgba(${rgb(T.acento2)},`;
    let w = 0; let h = 0; let pistas = []; let paquetes = []; let puntos = [];
    const largo = (pts) => pts.slice(1).reduce((s, q, i) => s + Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]), 0);
    function enPista(p, t) {
      let d = t * p.largo;
      for (let i = 1; i < p.pts.length; i++) {
        const [x0, y0] = p.pts[i - 1]; const [x1, y1] = p.pts[i]; const s = Math.hypot(x1 - x0, y1 - y0);
        if (d <= s) return [x0 + ((x1 - x0) * d) / s, y0 + ((y1 - y0) * d) / s];
        d -= s;
      }
      return p.pts[p.pts.length - 1];
    }
    function crear() {
      if (T.fondo === 'circuito') {
        const paso = 46;
        pistas = Array.from({ length: Math.max(12, Math.round((w * h) / 36000)) }, () => {
          let x = Math.round((Math.random() * w) / paso) * paso; let y = Math.round((Math.random() * h) / paso) * paso;
          const pts = [[x, y]];
          for (let s = 0; s < 4; s++) {
            if (s % 2 === 0) x += (Math.random() < 0.5 ? -1 : 1) * paso * (2 + Math.floor(Math.random() * 5));
            else y += (Math.random() < 0.5 ? -1 : 1) * paso * (1 + Math.floor(Math.random() * 3));
            pts.push([x, y]);
          }
          return { pts, largo: largo(pts) };
        });
        paquetes = pistas.filter((_, i) => i % 2 === 0).map((p, i) => ({ p, t: Math.random(), v: 0.0012 + Math.random() * 0.0022, c: i % 3 === 0 ? B : A }));
      } else {
        puntos = Array.from({ length: Math.min(90, Math.round((w * h) / 15000)) }, () => ({
          x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 1.8 + 0.7 }));
      }
    }
    function medir() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      crear();
    }
    function dibujar() {
      ctx.clearRect(0, 0, w, h);
      if (T.fondo === 'circuito') {
        ctx.lineWidth = 1.2;
        for (const p of pistas) {
          ctx.strokeStyle = `${A}0.11)`; ctx.beginPath();
          p.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
          const [x, y] = p.pts[p.pts.length - 1]; ctx.fillStyle = `${A}0.3)`; ctx.fillRect(x - 2.5, y - 2.5, 5, 5);
          const [x0, y0] = p.pts[0]; ctx.strokeStyle = `${A}0.28)`; ctx.strokeRect(x0 - 3.5, y0 - 3.5, 7, 7);
        }
        for (const q of paquetes) {
          q.t = (q.t + q.v) % 1;
          const [x, y] = enPista(q.p, q.t);
          const g = ctx.createRadialGradient(x, y, 0, x, y, 12); g.addColorStop(0, `${q.c}0.95)`); g.addColorStop(1, `${q.c}0)`);
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
        }
      } else {
        for (const p of puntos) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > w) p.vx *= -1; if (p.y < 0 || p.y > h) p.vy *= -1; }
        ctx.lineWidth = 1;
        for (let i = 0; i < puntos.length; i++) {
          for (let j = i + 1; j < puntos.length; j++) {
            const a = puntos[i]; const b = puntos[j]; const d = Math.hypot(a.x - b.x, a.y - b.y);
            if (d < 135) { ctx.strokeStyle = `${A}${(0.16 * (1 - d / 135)).toFixed(3)})`; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
          }
        }
        for (const p of puntos) { ctx.fillStyle = `${p.r > 2.1 ? B : A}0.75)`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    medir();
    window.addEventListener('resize', medir);
    if (reducido) { dibujar(); return; }
    let ultimo = 0;
    const ciclo = (t) => { if (t - ultimo > 33) { dibujar(); ultimo = t; } requestAnimationFrame(ciclo); };
    requestAnimationFrame(ciclo);
  }

  // ------------------------------------------------------------------ teclado, sonido y arranque
  document.addEventListener('keydown', (ev) => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.key === 'Enter' && est.cerrado) { const s = document.getElementById('seguir'); if (s && document.activeElement && document.activeElement.id === 'retro-titulo') { ev.preventDefault(); s.click(); } return; }
    if (est.cerrado) return;
    const k = LETRAS.indexOf(ev.key.toUpperCase());
    const idx = k >= 0 ? k : '1234'.indexOf(ev.key);
    if (idx < 0) return;
    const b = app.querySelector(`.opcion[data-k="${idx}"]`);
    if (b && !b.disabled) { ev.preventDefault(); b.click(); }
  });
  document.addEventListener('click', (ev) => {
    const s = ev.target.closest('#btn-sonido, #btn-sonido-portada');
    if (!s) return;
    sonido.activar(!sonido.on);
    sonido.clic();
    document.querySelectorAll('#btn-sonido').forEach((b) => { b.setAttribute('aria-pressed', String(sonido.on)); b.innerHTML = `${ico(sonido.on ? 'sonido' : 'silencio')}<span class="sr">Sonido</span>`; });
    const bp = document.getElementById('btn-sonido-portada');
    if (bp) bp.outerHTML = botonSonido();
  });
  window.addEventListener('pagehide', () => scorm.cerrar());
  window.addEventListener('beforeunload', () => scorm.cerrar());
  document.getElementById('pie').textContent = `${D.curso} · ${D.cursoNombre} · Módulo 2 · Quiz formativo, sin nota`;
  reiniciar();
  scorm.iniciar();
  fondo();
  portada();
})();
</script>
